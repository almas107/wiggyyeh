[package]
name = "wobbleworks-3d"
description = "WobbleWorks 3D: Feather-style 3D curve drawing with boiling lines (scene, guides, camera, renderer; no UI)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Curves are built on every core (the web build stays single-threaded).
rayon = { workspace = true }

[dev-dependencies]
# PNG output for the render example (examples/render.rs).
image = { workspace = true, features = ["png"] }
