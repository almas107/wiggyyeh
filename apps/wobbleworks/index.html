<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="description" content="WobbleWorks: a cute drawing app where every line boils.">
  <title>WobbleWorks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%23ffd23f' stroke='%2317161c' stroke-width='3'/%3E%3Cpath d='M8 18 q4 -8 8 0 t8 0' fill='none' stroke='%23ff2e88' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link data-trunk rel="rust" data-bin="wobbleworks" data-cargo-profile="wasm-release" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e4e1ee;
      background-image: radial-gradient(#17161c 1px, transparent 1px); background-size: 14px 14px; }
    #wobbleworks_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #wobbleworks_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #17161c; font: 15px ui-rounded, system-ui, sans-serif; pointer-events: none; }
    #wobbleworks_loading .card { background: #fbfaff; border: 3px solid #17161c; border-radius: 14px; box-shadow: 6px 6px 0 #17161c; padding: 18px 26px; max-width: 420px; }
    #wobbleworks_loading h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
    #wobbleworks_loading h1 span { display: inline-block; animation: boil .36s steps(1, end) infinite; }
    #wobbleworks_loading h1 span:nth-child(3n+2) { animation-delay: .12s; }
    #wobbleworks_loading h1 span:nth-child(3n) { animation-delay: .24s; }
    @keyframes boil { 0% { transform: translate(0, 0); } 33% { transform: translate(1px, -1px); } 66% { transform: translate(-1px, 1px); } }
    @media (prefers-reduced-motion: reduce) { #wobbleworks_loading h1 span { animation: none; } }
    #wobbleworks_loading p { margin: 6px 0 0; line-height: 1.5; }
    #wobbleworks_loading a { color: #ff2e88; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never arrives, no Rust runs to
       say so, so the page itself shows what to do after a while. */
    #wobbleworks_stalled { visibility: hidden; animation: wobbleworks-stalled 0s 20s forwards; color: #6b6878; }
    @keyframes wobbleworks-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="wobbleworks_canvas"></canvas>
  <div id="wobbleworks_loading">
    <div class="card">
      <h1><span>W</span><span>o</span><span>b</span><span>b</span><span>l</span><span>e</span><span>W</span><span>o</span><span>r</span><span>k</span><span>s</span></h1>
      <p>Warming up the wiggles&hellip;</p>
      <p id="wobbleworks_stalled">This is taking longer than usual. If nothing happens, the app's files may not have
        downloaded. <a href="">Reload</a> to try again.</p>
    </div>
  </div>
</body>
</html>
