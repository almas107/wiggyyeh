[package]
name = "wobbleworks"
description = "WobbleWorks: a cute, wiggly drawing app built on PhotoCraft (native and web)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wobbleworks"
path = "src/main.rs"

[dependencies]
# Everything goes through PhotoCraft: the engine's Session and command registry, its file formats
# and its editor (canvas, tools, panels, menus).
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
# The 3D mode's note, tools and renderer (no UI): Feather-style drawing in 3D.
wobbleworks-3d = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# .wob projects store raster frames as base64 PNG data URLs.
base64 = "0.22"
photocraft-raster = { workspace = true }
photocraft-color = { workspace = true }
# Animated GIF export of the boil frames.
image = { workspace = true, features = ["gif", "png"] }

[dev-dependencies]
photocraft-geom = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
photocraft-format = { workspace = true }
rfd = { workspace = true }
# Sound output (the samples are synthesized in `audio.rs`).
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "CssStyleDeclaration", "Event", "EventTarget", "AudioContext", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode"] }
