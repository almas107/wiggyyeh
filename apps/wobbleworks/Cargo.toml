[package]
name = "wobbleworks"
description = "WobbleWorks: a cute, boiling-line animated drawing app (native and web)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wobbleworks"
path = "src/main.rs"

[dependencies]
egui = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
image = { workspace = true, features = ["png", "gif", "jpeg", "webp", "bmp"] }

[dev-dependencies]
# Headless UI tests (and the offscreen screenshot test, which renders through wgpu).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
rfd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "CssStyleDeclaration", "Storage", "Event", "EventTarget", "PointerEvent"] }
